<body style="font-family:Arial,sans-serif;background:#f5f8f5;color:#17301f;display:grid;place-items:center;min-height:100vh;margin:0">
<div style="text-align:center;padding:30px">

  <p style="color:#6b7a70;font-size:13px">Mohon tunggu.</p>
  <a id="link" href="#">Buka CMS</a>
</div>
<script>
(function(){
  var url=window.BMT_CMS_ENDPOINT;
  var link=document.getElementById('link');
  if(!url){link.textContent='Endpoint CMS belum dikonfigurasi.';return;}
  link.href=url; link.target='_top';
  window.location.replace(url);
})();
</script>
