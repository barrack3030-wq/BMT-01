# Pages CMS configuration for BMT Al-Muhajirin Toili
media:
  input: public/content/media
  output: /BMT-01/content/media
  rename: safe
  categories: [image]
  extensions: [png, jpg, jpeg, webp]

components:
  seo:
    type: object
    label: SEO
    fields:
      - name: imageAlt
        label: Alt gambar
        type: string

content:
  - name: website
    label: Website
    type: group
    items:
      - name: settings
        label: Identitas & Tampilan
        type: file
        path: public/content/site-settings.json
        format: json
        operations:
          delete: false
        fields:
          - name: logoUrl
            label: Logo
            type: image
            options:
              path: logo
          - name: logoWidth
            label: Lebar logo (px)
            type: number
          - name: heroImages
            label: Gambar Hero
            type: image
            list:
              min: 4
              max: 4
            options:
              path: hero
          - name: backgroundImage
            label: Background
            type: image
            options:
              path: background
          - name: promoImage
            label: Gambar Promo
            type: image
            options:
              path: promo
          - name: promoTitle
            label: Judul Promo
            type: string
          - name: promoDescription
            label: Deskripsi Promo
            type: text
          - name: chatLabel
            label: Label Chat
            type: string
          - name: chatUrl
            label: Link Chat Admin
            type: string
          - name: instagramUrl
            label: Instagram
            type: string
          - name: facebookUrl
            label: Facebook
            type: string
          - name: topbarText
            label: Teks bar atas
            type: string
          - name: operatingHours
            label: Jam layanan
            type: string

      - name: about
        label: Tentang Kami
        type: file
        path: public/content/about.json
        format: json
        operations:
          delete: false
        fields:
          - name: title
            label: Label
            type: string
          - name: heading
            label: Heading
            type: string
          - name: paragraphs
            label: Isi Profil
            type: text
            list:
              min: 1
          - name: vision
            label: Visi
            type: text
          - name: mission
            label: Misi
            type: text
            list:
              min: 1
          - name: legality
            label: Legalitas
            type: text

  - name: konten
    label: Konten Website
    type: group
    items:
      - name: products
        label: Produk & Layanan
        type: file
        path: public/content/products.json
        format: json
        list: true
        fields:
          - name: id
            label: ID
            type: string
          - name: badge
            label: Label
            type: string
          - name: title
            label: Nama Produk
            type: string
          - name: description
            label: Deskripsi
            type: text
          - name: features
            label: Fitur
            type: text
            list: true
          - name: image
            label: Gambar
            type: image
          - name: imageAlt
            label: Alt gambar
            type: string
          - name: akad
            label: Akad
            type: string
          - name: active
            label: Tampilkan
            type: boolean
          - name: order
            label: Urutan
            type: number

      - name: articles
        label: Blog / Berita
        type: file
        path: public/content/articles.json
        format: json
        list: true
        fields:
          - name: id
            label: ID
            type: string
          - name: category
            label: Kategori
            type: string
          - name: date
            label: Tanggal
            type: string
          - name: meta
            label: Metadata tanggal
            type: string
          - name: title
            label: Judul
            type: string
          - name: slug
            label: Slug
            type: string
          - name: excerpt
            label: Ringkasan
            type: text
          - name: image
            label: Gambar utama
            type: image
          - name: imageAlt
            label: Alt gambar
            type: string
          - name: tags
            label: Tag
            type: string
            list: true
          - name: featured
            label: Unggulan
            type: boolean
          - name: contentParagraphs
            label: Isi Artikel
            type: text
            list: true
          - name: published
            label: Terbit
            type: boolean

      - name: board
        label: Pengurus Koperasi
        type: file
        path: public/content/board-members.json
        format: json
        list: true
        fields:
          - name: id
            label: ID
            type: string
          - name: name
            label: Nama
            type: string
          - name: role
            label: Jabatan
            type: string
          - name: badge
            label: Label
            type: string
          - name: photo
            label: Foto
            type: image
          - name: quote
            label: Kutipan
            type: text
          - name: order
            label: Urutan
            type: number
          - name: active
            label: Tampilkan
            type: boolean

      - name: testimonials
        label: Testimoni
        type: file
        path: public/content/testimonials.json
        format: json
        list: true
        fields:
          - name: id
            label: ID
            type: string
          - name: name
            label: Nama
            type: string
          - name: role
            label: Peran
            type: string
          - name: location
            label: Lokasi
            type: string
          - name: memberSince
            label: Sejak
            type: string
          - name: productUsed
            label: Produk
            type: string
          - name: quote
            label: Testimoni
            type: text
          - name: avatarText
            label: Inisial
            type: string
          - name: avatarImage
            label: Foto
            type: image
          - name: rating
            label: Rating
            type: number
          - name: active
            label: Tampilkan
            type: boolean

      - name: branches
        label: Lokasi & Cabang
        type: file
        path: public/content/branches.json
        format: json
        list: true
        fields:
          - name: id
            label: ID
            type: string
          - name: name
            label: Nama kantor
            type: string
          - name: badgeTitle
            label: Label
            type: string
          - name: address
            label: Alamat
            type: text
          - name: hours
            label: Jam layanan
            type: string
          - name: phone
            label: Telepon
            type: string
          - name: whatsapp
            label: WhatsApp
            type: string
          - name: mapsUrl
            label: Google Maps
            type: string
          - name: image
            label: Gambar
            type: image
          - name: mapEmbedQuery
            label: Query peta
            type: string
          - name: order
            label: Urutan
            type: number
          - name: active
            label: Tampilkan
            type: boolean

      - name: faq
        label: FAQ
        type: file
        path: public/content/faq.json
        format: json
        list: true
        fields:
          - name: id
            label: ID
            type: string
          - name: question
            label: Pertanyaan
            type: string
          - name: answer
            label: Jawaban
            type: text
          - name: order
            label: Urutan
            type: number
          - name: active
            label: Tampilkan
            type: boolean

settings:
  commit:
    identity: user
