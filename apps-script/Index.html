<!doctype html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g:#0f4d2e;--g2:#083b24;--soft:#eaf4ec;--line:#dce7df;--bg:#f5f8f5;--text:#17301f;--muted:#6b7a70;--danger:#a63232}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--g2),var(--g))}
.login-card{width:min(430px,100%);background:#fff;padding:34px;border:1px solid rgba(255,255,255,.3);box-shadow:0 24px 60px rgba(0,0,0,.22)}
.brand{display:flex;gap:14px;align-items:center}.brand img{width:76px;height:76px;object-fit:contain}.brand h1{font-size:22px;margin:0 0 5px}.brand p{margin:0;color:var(--muted);font-size:12px}
.field{margin-top:14px}.field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid var(--line);padding:11px 12px;background:#fff;outline:none;color:var(--text);border-radius:0}input:focus,textarea:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(15,77,46,.08)}textarea{min-height:120px;resize:vertical}
.btn{border:1px solid var(--g);background:var(--g);color:#fff;padding:10px 13px;font-size:11px;font-weight:800;letter-spacing:.05em}.btn:hover{background:var(--g2)}.btn.light{background:#fff;color:var(--g);border-color:var(--line)}.btn.danger{background:#fff;color:var(--danger);border-color:#eacaca}.btn.block{width:100%}
.notice,.error{padding:11px 12px;font-size:12px;margin-top:14px}.notice{background:#f4faf6;border:1px solid #d3e6d9;color:#31583f}.error{background:#fff4f4;border:1px solid #eacaca;color:#8a3232}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--g2);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh}.side-brand{display:flex;gap:10px;align-items:center;padding:6px 6px 18px;border-bottom:1px solid rgba(255,255,255,.12)}.side-brand img{width:45px;height:45px;object-fit:contain}.side-brand b{font-size:13px}.side-brand small{display:block;color:#b9d6c3;margin-top:3px}
.nav{margin-top:14px}.nav .sec{color:#87aa96;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;margin:13px 10px 5px}.nav button{display:flex;gap:9px;width:100%;padding:10px 11px;border:0;background:transparent;color:#dcefe2;text-align:left;font-weight:700;font-size:12px}.nav button.active,.nav button:hover{background:var(--g);color:#fff}
.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.top h2{margin:0;font-size:17px}.top .actions{display:flex;gap:7px}.content{padding:22px;max-width:1450px}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat,.panel{background:#fff;border:1px solid var(--line)}.stat{padding:17px}.stat small{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}.stat strong{display:block;font-size:29px;margin-top:5px}.panel{padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel h3{margin:0;font-size:17px}.muted{color:var(--muted);font-size:11px}
.table-wrap{overflow:auto;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:750px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:top}th{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#4d6656;background:#f2f7f3}tr:last-child td{border-bottom:0}.thumb{width:58px;height:46px;object-fit:cover;border:1px solid var(--line)}
.pill{display:inline-block;padding:4px 7px;background:var(--soft);border:1px solid #cfe1d4;color:var(--g);font-size:9px;font-weight:800;text-transform:uppercase}.row-actions{display:flex;gap:5px;white-space:nowrap}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.upload{display:flex;gap:7px;margin-top:6px}.upload input{display:none}.preview{width:100%;max-height:220px;object-fit:cover;border:1px solid var(--line);margin-top:7px;background:#eef4ef}.check{display:flex;align-items:center;gap:7px;margin-top:28px}.check input{width:auto}
.modal{position:fixed;inset:0;background:rgba(4,28,16,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modal-card{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid var(--line);box-shadow:0 24px 80px rgba(0,0,0,.25)}.modal-head,.modal-foot{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-foot{border-top:1px solid var(--line);border-bottom:0}.modal-body{padding:18px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--g2);color:#fff;padding:11px 13px;font-size:12px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-265px;width:250px;z-index:50;transition:left .2s}.sidebar.open{left:0}.stats{grid-template-columns:1fr 1fr}.content{padding:16px}}@media(max-width:620px){.fields{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.top .secondary{display:none}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card">
  <div class="brand"><img src="/BMT-01/images/logo/logo%20BMT.png" onerror="this.style.display='none'"><div><h1>BMT Al-Muhajirin</h1><p>CMS Website • Google Apps Script</p></div></div>
  <div class="notice">Password diverifikasi oleh Google Apps Script. Tidak disimpan di browser.</div>
  <div class="field"><label>Password Admin</label><input id="pw" type="password" placeholder="Masukkan password CMS"></div>
  <div style="margin-top:15px"><button id="loginBtn" class="btn block">MASUK KE CMS</button></div><div id="loginErr" class="error hidden"></div>
</div></div>

<div id="app" class="app hidden">
<aside id="side" class="sidebar">
  <div class="side-brand"><img id="sideLogo" src="" alt=""><div><b>BMT Al-Muhajirin</b><small>CMS Website</small></div></div>
  <div class="nav">
    <div class="sec">Utama</div><button data-page="dashboard">▦ Dashboard</button><button data-page="settings">⚙ Identitas & Tampilan</button>
    <div class="sec">Konten Website</div><button data-page="products">▣ Produk & Layanan</button><button data-page="articles">✎ Blog / Berita</button><button data-page="about">◫ Tentang Kami</button><button data-page="board">♙ Pengurus Koperasi</button><button data-page="testimonials">♡ Testimoni</button><button data-page="branches">⌖ Lokasi & Cabang</button><button data-page="faq">? FAQ</button>
    <div class="sec">Data</div><button data-page="backup">⇩ Backup & Import</button>
  </div>
</aside>
<main class="main">
  <div class="top"><div style="display:flex;align-items:center;gap:10px"><button id="menu" class="btn light">☰</button><h2 id="title">Dashboard</h2></div><div class="actions"><a class="btn light secondary" target="_blank" href="https://barrack3030-wq.github.io/BMT-01/">LIHAT WEBSITE</a><button id="logout" class="btn">KELUAR</button></div></div>
  <div id="content" class="content"></div>
</main>
</div>

<div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><div><b id="mTitle">Editor</b><div id="mSub" class="muted"></div></div><button id="mClose" class="btn light">TUTUP</button></div><div id="mBody" class="modal-body"></div><div class="modal-foot"><button id="mDelete" class="btn danger hidden">HAPUS</button><span></span><button id="mCancel" class="btn light">BATAL</button><button id="mSave" class="btn">SIMPAN</button></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const S={token:null,data:null,page:'dashboard',edit:null};
const T={dashboard:'Dashboard',settings:'Identitas & Tampilan',products:'Produk & Layanan',articles:'Blog / Berita',about:'Tentang Kami',board:'Pengurus Koperasi',testimonials:'Testimoni',branches:'Lokasi & Cabang',faq:'FAQ',backup:'Backup & Import'};
const schemas={
products:{label:'Produk',defs:{badge:'Produk Syariah',title:'Produk Baru',description:'',features:[],image:'',imageAlt:'',akad:'',active:true,order:1},fields:[['title','Nama Produk','text',1],['badge','Label','text'],['akad','Akad','text'],['description','Deskripsi','textarea',1],['features','Fitur (1 per baris)','lines',1],['image','URL gambar','text',1],['imageAlt','Alt gambar','text'],['order','Urutan','number'],['active','Tampilkan','check']]},
articles:{label:'Artikel',defs:{category:'Informasi',date:'',meta:'',title:'Artikel Baru',excerpt:'',image:'',imageAlt:'',tags:[],featured:false,contentParagraphs:[''],published:true},fields:[['title','Judul','text',1],['category','Kategori','text'],['date','Tanggal','text'],['meta','Metadata tanggal','text'],['excerpt','Ringkasan','textarea',1],['image','URL gambar','text',1],['imageAlt','Alt gambar','text'],['tags','Tag (1 per baris)','lines'],['contentParagraphs','Isi (paragraf dipisahkan baris kosong)','rich',1],['featured','Unggulan','check'],['published','Terbit','check']]},
board:{label:'Pengurus',defs:{name:'Nama Pengurus',role:'Ketua',badge:'Pengurus',photo:'',quote:'',order:1,active:true},fields:[['name','Nama','text'],['role','Jabatan','text'],['badge','Label','text'],['photo','URL foto','text',1],['quote','Kutipan','textarea',1],['order','Urutan','number'],['active','Tampilkan','check']]},
testimonials:{label:'Testimoni',defs:{name:'Nama Anggota',role:'Anggota',location:'Toili',memberSince:'',productUsed:'',quote:'',avatarText:'NA',avatarImage:'',rating:5,active:true},fields:[['name','Nama','text'],['role','Peran','text'],['location','Lokasi','text'],['memberSince','Sejak','text'],['productUsed','Produk','text'],['quote','Testimoni','textarea',1],['avatarText','Inisial','text'],['avatarImage','URL foto','text',1],['rating','Rating 1-5','number'],['active','Tampilkan','check']]},
branches:{label:'Kantor / Cabang',defs:{name:'Kantor Baru',badgeTitle:'Cabang Pelayanan',address:'',hours:'Senin – Jumat : 08.00 – 16.00 WITA',phone:'',whatsapp:'',mapsUrl:'',image:'',mapEmbedQuery:'',active:true,order:1},fields:[['name','Nama kantor','text'],['badgeTitle','Label','text'],['address','Alamat','textarea',1],['hours','Jam layanan','text'],['phone','Telepon','text'],['whatsapp','WhatsApp','text'],['mapsUrl','Google Maps URL','text',1],['image','URL gambar','text',1],['mapEmbedQuery','Query peta','text',1],['order','Urutan','number'],['active','Tampilkan','check']]},
faq:{label:'FAQ',defs:{question:'Pertanyaan baru',answer:'Jawaban',active:true,order:1},fields:[['question','Pertanyaan','text',1],['answer','Jawaban','textarea',1],['order','Urutan','number'],['active','Tampilkan','check']]}
};
function gas(name,...args){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e?.message||e))[name](...args))}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2300)}
function sort(a){return [...(a||[])].sort((x,y)=>(Number(x.order)||999)-(Number(y.order)||999))}
function stat(n,l){return '<div class="stat"><small>'+l+'</small><strong>'+n+'</strong></div>'}
function navBind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;document.getElementById('side').classList.remove('open');render()})}
function render(){
 document.getElementById('title').textContent=T[S.page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===S.page));
 const c=document.getElementById('content');if(S.page==='dashboard')c.innerHTML=dashboard();else if(S.page==='settings')c.innerHTML=settings();else if(S.page==='about')c.innerHTML=about();else if(S.page==='backup')c.innerHTML=backup();else c.innerHTML=collection(S.page);bind();
}
function dashboard(){const d=S.data;return '<div class="grid stats">'+stat(d.products?.length||0,'Produk')+stat(d.articles?.length||0,'Artikel')+stat(d.board?.length||0,'Pengurus')+stat(d.branches?.length||0,'Kantor / Cabang')+'</div><div style="height:14px"></div><div class="grid" style="grid-template-columns:2fr 1fr"><div class="panel"><div class="panel-head"><div><h3>CMS BMT Al-Muhajirin</h3><div class="muted" style="margin-top:5px">Kelola website dari satu tempat.</div></div><button class="btn" data-go="settings">ATUR TAMPILAN</button></div><div class="notice">Modul tersedia: logo + ukuran, 4 hero, background, promo, Chat Admin, Instagram/Facebook, produk + tambah, blog + edit, Tentang Kami, pengurus + tambah, testimoni + foto, lokasi + tambah cabang, FAQ, backup/import.</div></div><div class="panel"><h3>API Publik</h3><div class="muted" style="margin-top:8px;word-break:break-all">'+esc(d.meta?.webAppUrl||'Belum tersedia')+'</div><div style="margin-top:12px"><span class="pill">Green / White</span></div></div></div>'}
function collection(page){const s=schemas[page],rows=sort(S.data[page]);return '<div class="panel"><div class="panel-head"><div><h3>'+s.label+'</h3><div class="muted">'+rows.length+' data tersimpan</div></div><button id="add" class="btn">+ TAMBAH '+s.label.toUpperCase()+'</button></div>'+(rows.length?'<div class="table-wrap"><table><thead><tr><th>Data</th><th>Status</th><th>Urutan</th><th>Aksi</th></tr></thead><tbody>'+rows.map(r=>row(page,r)).join('')+'</tbody></table></div>':'<div class="notice">Belum ada data.</div>')+'</div>'}
function row(page,r){const title=r.title||r.name||r.question||'Item',img=r.image||r.photo||r.avatarImage,active=r.active!==false&&r.published!==false;return '<tr><td><div style="display:flex;gap:9px;align-items:center">'+(img?'<img class="thumb" src="'+esc(img)+'">':'')+'<div><b>'+esc(title)+'</b><div class="muted">'+esc(r.role||r.category||r.badgeTitle||'')+'</div></div></div></td><td><span class="pill">'+(active?'Aktif':'Draft')+'</span></td><td>'+esc(r.order??'-')+'</td><td class="row-actions"><button class="btn light" data-edit="'+page+'" data-id="'+esc(r.id)+'">EDIT</button><button class="btn danger" data-del="'+page+'" data-id="'+esc(r.id)+'">HAPUS</button></td></tr>'}
function settings(){
 const s=S.data.settings||{},h=(s.heroImages||[]);while(h.length<4)h.push('');
 return '<div class="panel"><div class="panel-head"><div><h3>Identitas & Tampilan</h3><div class="muted">Logo, hero, background, promo, sosial media dan chat admin.</div></div><button id="saveSet" class="btn">SIMPAN</button></div><div class="fields">'+
 F('siteName','Nama website','text',s.siteName)+F('tagline','Tagline','text',s.tagline)+F('logoUrl','URL logo','text',s.logoUrl,1)+F('logoWidth','Lebar logo px','number',s.logoWidth)+
 F('backgroundImage','URL background','text',s.backgroundImage,1)+F('promoImage','URL promo / ucapan','text',s.promoImage,1)+F('promoTitle','Judul promo','text',s.promoTitle)+F('promoDescription','Deskripsi promo','text',s.promoDescription)+
 F('chatLabel','Label Chat','text',s.chatLabel)+F('chatUrl','Link Chat Admin','text',s.chatUrl)+F('instagramUrl','Instagram URL','text',s.instagramUrl)+F('facebookUrl','Facebook URL','text',s.facebookUrl)+
 F('topbarText','Teks bar atas','text',s.topbarText)+F('operatingHours','Jam layanan','text',s.operatingHours)+
 '</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h4 style="margin:0 0 12px">4 Gambar Hero</h4><div class="grid" style="grid-template-columns:1fr 1fr">'+[0,1,2,3].map(i=>'<div class="field"><label>Hero '+(i+1)+'</label><input id="h'+i+'" value="'+esc(h[i]||'')+'"><div class="upload"><label class="btn light">UPLOAD GAMBAR<input id="uph'+i+'" type="file" accept="image/*"></label></div></div>').join('')+'</div></div>'
}function about(){const a=S.data.pages?.about||{};return '<div class="panel"><div class="panel-head"><div><h3>Tentang Kami</h3><div class="muted">Profil, visi, misi dan legalitas.</div></div><button id="saveAbout" class="btn">SIMPAN</button></div><div class="fields">'+F('aboutTitle','Label','text',a.title)+F('aboutHeading','Heading','text',a.heading)+F('aboutParagraphs','Isi (1 paragraf per baris)','lines',a.paragraphs,1)+F('aboutVision','Visi','textarea',a.vision,1)+F('aboutMission','Misi (1 poin per baris)','lines',a.mission,1)+F('aboutLegality','Legalitas & pengawasan','textarea',a.legality,1)+'</div></div>'}
function backup(){return '<div class="panel"><div class="panel-head"><div><h3>Backup & Import</h3><div class="muted">Export seluruh konten atau restore backup.</div></div><div><button id="exp" class="btn light">EXPORT JSON</button> <label class="btn light">IMPORT JSON<input id="imp" type="file" accept=".json" style="display:none"></label></div></div><div class="notice">Backup tidak berisi password administrator.</div></div>'}
function F(k,l,t,v,full){
 let cls=full?'full':'';
 if(t==='check')return '<div class="check '+cls+'"><input id="f_'+k+'" type="checkbox" '+(v?'checked':'')+'><b>'+l+'</b></div>';
 if(t==='lines')return '<div class="field '+cls+'"><label>'+l+'</label><textarea id="f_'+k+'">'+esc((Array.isArray(v)?v:[]).join('\\n'))+'</textarea></div>';
 if(t==='textarea')return '<div class="field '+cls+'"><label>'+l+'</label><textarea id="f_'+k+'">'+esc(v||'')+'</textarea></div>';\n if(t==='rich')return '<div class="field '+cls+'"><label>'+l+'</label><textarea id="f_'+k+'" style="min-height:260px">'+esc((Array.isArray(v)?v:[]).join('\\n\\n'))+'</textarea><div class="muted" style="margin-top:5px">Pisahkan paragraf dengan satu baris kosong.</div></div>';
 const basic=k.split('_').pop();
 const uploadable=['image','photo','avatarImage','logoUrl','backgroundImage','promoImage'].includes(basic);
 return '<div class="field '+cls+'"><label>'+l+'</label><input id="f_'+k+'" type="'+(t==='number'?'number':'text')+'" value="'+esc(v??'')+'">'+(uploadable?'<div class="upload"><label class="btn light">UPLOAD GAMBAR<input id="up_'+k+'" type="file" accept="image/*"></label></div>':'')+'</div>';
}
function wireUploads(){
 document.querySelectorAll('input[id^="up_"]').forEach(input=>{
  input.onchange=async()=>{
   const file=input.files?.[0]; if(!file)return;
   toast('Mengunggah gambar...');
   try{
    const result=await gas('uploadImage',S.token,await fileToBase64(file),file.name,file.type);
    const key=input.id.slice(3),target=document.getElementById('f_'+key);
    if(target)target.value=result.url;
    toast('Gambar berhasil diunggah.');
   }catch(e){toast(e.message)}
  };
 });
}
function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});}
function openEdit(page,id){const s=schemas[page],src=(S.data[page]||[]).find(x=>x.id===id)||Object.assign({id:page+'-'+Date.now()},s.defs);S.edit={page,id:src.id};document.getElementById('mTitle').textContent=(id?'Edit ':'Tambah ')+s.label;document.getElementById('mSub').textContent='ID: '+src.id;document.getElementById('mDelete').classList.toggle('hidden',!id);document.getElementById('mBody').innerHTML='<div class="fields">'+s.fields.map(f=>F('edit_'+f[0],f[1],f[2],src[f[0]],f[3])).join('')+'</div>';document.getElementById('modal').classList.add('open')}
function getF(k,t){const e=document.getElementById('f_'+k);if(!e)return '';if(t==='check')return e.checked;if(t==='lines')return e.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(t==='rich')return e.value.split(/\n\s*\n/g).map(x=>x.trim()).filter(Boolean);if(t==='number')return Number(e.value||0);return e.value.trim()}
async function saveEdit(){const p=S.edit.page,s=schemas[p],old=(S.data[p]||[]).find(x=>x.id===S.edit.id)||Object.assign({id:S.edit.id},s.defs),r=Object.assign({},old);s.fields.forEach(f=>r[f[0]]=getF('edit_'+f[0],f[2]));await gas('saveRecord',S.token,p,r);S.data[p]=(S.data[p]||[]).filter(x=>x.id!==r.id).concat(r);close();render();toast('Data disimpan.')}
async function delEdit(){if(!confirm('Hapus data ini?'))return;await gas('deleteRecord',S.token,S.edit.page,S.edit.id);S.data[S.edit.page]=S.data[S.edit.page].filter(x=>x.id!==S.edit.id);close();render();toast('Data dihapus.')}
function close(){document.getElementById('modal').classList.remove('open');S.edit=null}
async function saveSet(){const s=Object.assign({},S.data.settings,{id:'global'});['siteName','tagline','logoUrl','backgroundImage','promoImage','promoTitle','promoDescription','chatLabel','chatUrl','instagramUrl','facebookUrl','topbarText','operatingHours'].forEach(k=>s[k]=document.getElementById('f_'+k).value.trim());s.logoWidth=Number(document.getElementById('f_logoWidth').value||160);s.heroImages=[0,1,2,3].map(i=>document.getElementById('h'+i).value.trim());const r=await gas('saveSettings',S.token,s);S.data.settings=r.record;render();toast('Pengaturan disimpan.')}
async function saveAbout(){const a={id:'about',title:v('aboutTitle'),heading:v('aboutHeading'),paragraphs:v('aboutParagraphs').split(/\n+/).filter(Boolean),vision:v('aboutVision'),mission:v('aboutMission').split(/\n+/).filter(Boolean),legality:v('aboutLegality')};const r=await gas('savePage',S.token,'about',a);S.data.pages.about=r.record;render();toast('Tentang Kami disimpan.')}
function v(k){return document.getElementById('f_'+k)?.value.trim()||''}
function bind(){
 navBind(); wireUploads();
 document.querySelectorAll('input[id^="uph"]').forEach(input=>input.onchange=async()=>{const file=input.files?.[0];if(!file)return;toast('Mengunggah hero...');try{const result=await gas('uploadImage',S.token,await fileToBase64(file),file.name,file.type);const index=input.id.slice(3);document.getElementById('h'+index).value=result.url;toast('Hero '+(Number(index)+1)+' siap.')}catch(e){toast(e.message)}});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.page=b.dataset.go;render()});const add=document.getElementById('add');if(add)add.onclick=()=>openEdit(S.page);
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit,b.dataset.id));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus data ini?'))return;await gas('deleteRecord',S.token,b.dataset.del,b.dataset.id);S.data[b.dataset.del]=S.data[b.dataset.del].filter(x=>x.id!==b.dataset.id);render();toast('Data dihapus.')});
 document.getElementById('saveSet')?.addEventListener('click',()=>saveSet().catch(e=>toast(e.message)));document.getElementById('saveAbout')?.addEventListener('click',()=>saveAbout().catch(e=>toast(e.message)));
 document.getElementById('exp')?.addEventListener('click',()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(S.data,null,2)],{type:'application/json'}));a.href=u;a.download='bmt-cms-backup.json';a.click();URL.revokeObjectURL(u)});
 document.getElementById('imp')?.addEventListener('change',async e=>{try{S.data=await gas('importData',S.token,JSON.parse(await e.target.files[0].text()));render();toast('Import berhasil.')}catch(x){toast(x.message)}})
}
document.getElementById('loginBtn').onclick=async()=>{try{const r=await gas('login',document.getElementById('pw').value);S.token=r.token;S.data=r.bootstrap;sessionStorage.setItem('bmtCmsToken',S.token);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}catch(e){document.getElementById('loginErr').textContent=e.message;document.getElementById('loginErr').classList.remove('hidden')}}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click()});document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');document.getElementById('logout').onclick=async()=>{try{await gas('logout',S.token)}catch(e){}sessionStorage.removeItem('bmtCmsToken');location.reload()}
document.getElementById('mClose').onclick=close;document.getElementById('mCancel').onclick=close;document.getElementById('mSave').onclick=()=>saveEdit().catch(e=>toast(e.message));document.getElementById('mDelete').onclick=()=>delEdit().catch(e=>toast(e.message));
(async()=>{const t=sessionStorage.getItem('bmtCmsToken');if(!t)return;try{S.token=t;S.data=await gas('getBootstrap',t);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}catch(e){sessionStorage.removeItem('bmtCmsToken')}})();
</script>
</body>
</html>
