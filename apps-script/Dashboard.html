<!doctype html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — BMT Al-Muhajirin CMS</title>
<?!= include('Styles'); ?>
</head>
<body>
<div class="dashboard">
  <header class="top">
    <div class="brandline">BMT Al-Muhajirin CMS</div>
    <div class="top-actions">
      <button id="logoutBtn" class="btn outline" onclick="logout()">KELUAR</button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h2 id="welcome">Memuat…</h2>
      <p id="roleText">Memeriksa sesi login…</p>
    </section>

    <section class="grid">
      <article class="panel">
        <small>Nama</small>
        <b id="userName">-</b>
      </article>
      <article class="panel">
        <small>Email</small>
        <b id="userEmail">-</b>
      </article>
      <article class="panel">
        <small>Role</small>
        <b id="userRole">-</b>
        <span id="roleBadge" class="role">-</span>
      </article>
    </section>

    <div id="errorBox" class="error hidden"></div>
  </main>
</div>

<script>
const WEB_APP_URL = '<?= webAppUrl ?>';

function showError(message){
  const el = document.getElementById('errorBox');
  el.textContent = message || 'Terjadi kesalahan.';
  el.classList.remove('hidden');
}

function redirectLogin(){
  window.top.location.href = WEB_APP_URL + '?page=login';
}

function loadCurrentUser(){
  google.script.run
    .withSuccessHandler(function(user){
      if (!user || user.loggedIn !== true){
        redirectLogin();
        return;
      }

      document.getElementById('welcome').textContent = 'Selamat datang, ' + user.nama;
      document.getElementById('roleText').textContent = 'Sesi aktif pada CMS BMT Al-Muhajirin.';
      document.getElementById('userName').textContent = user.nama;
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('userRole').textContent = user.role;
      document.getElementById('roleBadge').textContent = user.role;

      if (user.role === 'admin'){
        document.getElementById('roleText').textContent = 'Akses administrator aktif. Semua modul CMS dapat ditampilkan di sini.';
      } else if (user.role === 'user'){
        document.getElementById('roleText').textContent = 'Akses pengguna aktif sesuai role user.';
      }
    })
    .withFailureHandler(function(error){
      showError(error && error.message ? error.message : 'Sesi tidak dapat diperiksa.');
      setTimeout(redirectLogin, 1200);
    })
    .getCurrentUser();
}

function logout(){
  document.getElementById('logoutBtn').disabled = true;

  google.script.run
    .withSuccessHandler(function(){
      redirectLogin();
    })
    .withFailureHandler(function(){
      redirectLogin();
    })
    .doLogout();
}

loadCurrentUser();
</script>
</body>
</html>
