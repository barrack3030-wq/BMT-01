<style>
:root{--green:#0f4d2e;--green2:#083b24;--soft:#eaf4ec;--line:#dce7df;--text:#17301f;--muted:#6b7a70;--danger:#9c3030;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--text);background:#f5f8f5}
button,input{font:inherit}.page{min-height:100vh}.center{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,var(--green2),var(--green))}
.card{width:min(430px,100%);background:#fff;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.22)}
.logo{width:78px;height:78px;object-fit:contain;display:block;margin-bottom:18px}.title{margin:0;font-size:25px}.sub{margin:7px 0 0;color:var(--muted);font-size:13px}
.field{margin-top:17px}.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;color:var(--muted)}
input{width:100%;border:1px solid var(--line);padding:12px 13px;outline:none;background:#fff}input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,77,46,.08)}
.btn{width:100%;border:0;background:var(--green);color:#fff;padding:13px 15px;margin-top:18px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}
.error,.notice{padding:11px 12px;margin-top:14px;font-size:12px;line-height:1.6}.error{background:#fff4f4;border:1px solid #edcdcd;color:var(--danger)}.notice{background:#f4faf6;border:1px solid #d5e6da}
.hidden{display:none!important}.loading{opacity:.7}
.dashboard{min-height:100vh;background:#f5f8f5}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brandline{font-weight:800}.top-actions{display:flex;gap:8px}.top button{width:auto;margin:0;padding:9px 12px}.outline{background:#fff;color:var(--green);border:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:24px}.hero{background:var(--green2);color:#fff;padding:24px;margin-bottom:16px}.hero h2{margin:0;font-size:25px}.hero p{margin:8px 0 0;color:#cfe4d6}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.panel{background:#fff;border:1px solid var(--line);padding:18px}.panel b{font-size:22px;display:block}.panel small{color:var(--muted)}.role{display:inline-block;margin-top:10px;padding:5px 8px;background:var(--soft);color:var(--green);font-size:10px;font-weight:800;text-transform:uppercase}
@media(max-width:700px){.grid{grid-template-columns:1fr}.top{padding:0 14px}.wrap{padding:14px}}
</style>
